name: build-desktop

# 用 GitHub Actions 的 windows runner 出安装包（.msi + .exe），绕过本地/沙箱缺 webkit。
# 交付走 Release 资产（不占 Actions 制品存储配额）：
#   - 推分支：仅编译校验（不上传，不受配额影响）
#   - 推 tag v*：编译 + 发布 Release，安装包作为可下载资产挂上去
on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/business-project-docking-workbench-ccies1"
    paths:
      - "app/src/**"
      - "app/src-tauri/**"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/vite.config.ts"
      - "app/tsconfig.json"
      - "app/index.html"
      - ".github/workflows/tauri-build.yml"

# 让内置 GITHUB_TOKEN 能创建 Release
permissions:
  contents: write

env:
  RUST_BACKTRACE: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 当前 Windows 优先；日后加 macos-latest / ubuntu-22.04 只需在此追加
        include:
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      # beforeBuildCommand(npm run build) 产出 dist → cargo tauri build 出安装包。
      # tagName/releaseName 里的 __VERSION__ 由 tauri-action 用应用版本(0.1.0)替换；
      # 该步用 GITHUB_TOKEN 直接在服务端创建 tag+Release 并挂上安装包资产
      # （无需本地推 tag，绕开沙箱 git 只能推指定分支的限制）。
      - name: Build Tauri + publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "战略发展分析工作台 v__VERSION__"
          releaseBody: "Windows 安装包：.msi（企业批量部署）/ -setup.exe（个人安装）。首次运行若弹 SmartScreen，点「更多信息 → 仍要运行」。"
          releaseDraft: false
          prerelease: false
